name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Scaffold a project and sweep it
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          ragsweep init
          cat > corpus/refunds.md <<'DOC'
          Refunds are processed within five business days of approval.
          Customers must request a refund within thirty days of delivery.
          Reimbursement returns to the original payment method.
          DOC
          cat > corpus/approvals.md <<'DOC'
          Any refund above five hundred dollars requires a manager sign-off.
          Sign-off cannot be granted by the agent raising the ticket.
          DOC
          ragsweep run --quiet --limit 5
      - name: The results file must be readable back
        run: |
          cd /tmp/smoke
          ragsweep report results.json --format csv | head -3
