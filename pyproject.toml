[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragsweep"
version = "0.1.0"
description = "Measure which retrieval settings actually find the right passage."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mohsin Ali" }]
keywords = ["rag", "retrieval", "embeddings", "evaluation", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.26", "rich>=13"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3"]
chart = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
ragsweep = "ragsweep.cli:main"

[project.urls]
Homepage = "https://github.com/mohsinaliwork686-rgb/ragsweep"
Issues = "https://github.com/mohsinaliwork686-rgb/ragsweep/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
